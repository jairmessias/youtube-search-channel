<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Channel Hunter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-links {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .nav-links a.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .score-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-color);
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1200px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="nav-links">
                <a href="index.html">Search</a>
                <a href="dashboard.html" class="active">Dashboard</a>
            </div>
            <h1>Your <span class="highlight">Saved</span> Channels</h1>
        </header>

        <div class="dashboard-stats">
            <div class="stat-card">
                <div class="stat-value" id="statTotalChannels">0</div>
                <div class="stat-label">Channels Scouted</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statHighPotential">0</div>
                <div class="stat-label">High Potential (>90 Score)</div>
            </div>
        </div>

        <div id="savedContainer" class="results-grid">
            <!-- Saved channels will appear here -->
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
